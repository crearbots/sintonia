<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar persona - Sintonía</title>
    {% include "_head_icons.html" %}
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/theme.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    {% set activo = 'personas' %}
    {% include "_nav.html" %}
    <main class="max-w-lg mx-auto px-3 sm:px-4 py-4 sm:py-8">
        <a href="/personas?estado=todos" class="text-blue-600 hover:underline text-sm">← Volver a Personas</a>
        <h2 class="text-2xl font-semibold text-gray-800 mt-2">Editar persona</h2>
        <p class="text-gray-600 text-sm mb-4">Corrige nombre, celular o estado. El celular no puede repetirse en otro registro.</p>
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">{{ error }}</div>
        {% endif %}
        <div class="bg-white rounded-lg shadow p-6">
            <form method="post" action="/persona/{{ persona.id }}" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" name="nombre" required value="{{ persona.nombre }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Celular (10 dígitos)</label>
                    <input type="text" name="celular"
                           value="{% if not persona.pendiente_revision %}{{ persona.celular }}{% endif %}"
                           placeholder="3115712505"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                    <select name="estado" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="Instalada" {% if persona.estado == "Instalada" %}selected{% endif %}>Instalada</option>
                        <option value="No instalada" {% if persona.estado == "No instalada" %}selected{% endif %}>No instalada</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-md hover:bg-blue-700 font-medium">Guardar</button>
                    <a href="/personas?estado=todos" class="bg-gray-200 text-gray-700 px-5 py-2.5 rounded-md">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    {% include "_footer.html" %}
</body>
</html>
