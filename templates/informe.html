<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe semanal - Sintonía</title>
    {% include "_head_icons.html" %}
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/theme.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
        {% set activo = 'informe' %}
    {% include "_nav.html" %}

    <main class="max-w-2xl mx-auto px-3 sm:px-4 py-4 sm:py-8">
        <div class="mb-6">
            <a href="/dashboard" class="text-blue-600 hover:underline text-sm">← Volver al Dashboard</a>
            <h2 class="text-2xl font-semibold text-gray-800 mt-2">Informe semanal</h2>
            <p class="text-gray-600 text-sm">Texto listo para copiar y pegar en WhatsApp</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
                <h3 class="font-medium text-gray-800">Vista previa</h3>
                <button id="btnCopiar"
                        class="btn-success w-full sm:w-auto">
                    📋 Copiar al portapapeles
                </button>
            </div>

            <pre id="textoInforme"
                 class="informe-pre">{{ texto_informe }}</pre>

            <p id="mensajeCopiado" class="text-green-600 text-sm mt-3 hidden">¡Copiado!</p>
        </div>

<a href="/dashboard" class="btn-ghost">← Volver al dashboard</a>
    </main>

    <script>
        document.getElementById('btnCopiar').addEventListener('click', async function () {
            const texto = document.getElementById('textoInforme').innerText;
            try {
                await navigator.clipboard.writeText(texto);
                const msg = document.getElementById('mensajeCopiado');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2000);
            } catch (err) {
                // Fallback para navegadores antiguos
                const range = document.createRange();
                range.selectNode(document.getElementById('textoInforme'));
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                const msg = document.getElementById('mensajeCopiado');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2000);
            }
        });
    </script>
    {% include "_footer.html" %}
</body>
</html>
