<link rel="icon" href="/static/img/logo/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/img/logo/favicon.svg">
<link rel="apple-touch-icon" href="/static/img/logo/favicon-180.png">
<meta property="og:title" content="Sintonía">
<meta property="og:description" content="Programación y censo del equipo.">
<meta property="og:image" content="{{ request.base_url }}static/img/logo/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ request.base_url }}static/img/logo/og-image.png">
<meta name="csrf-token" content="{{ request.session.get('csrf_token', '') }}">
<script>
document.addEventListener("DOMContentLoaded", function () {
  var meta = document.querySelector('meta[name="csrf-token"]');
  if (!meta || !meta.content) return;
  document.querySelectorAll('form[method="post"], form[method="POST"]').forEach(function (form) {
    if (form.querySelector('input[name="csrf_token"]')) return;
    var input = document.createElement("input");
    input.type = "hidden";
    input.name = "csrf_token";
    input.value = meta.content;
    form.appendChild(input);
  });
});
</script>
